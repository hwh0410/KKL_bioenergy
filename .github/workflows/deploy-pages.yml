name: Deploy 3D site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s index.html
          grep -q '<html' index.html
          mkdir -p _site
          cp index.html _site/index.html
          test -s plan/kinmen-jinning-2d.svg
          test -s plan/eia-existing-v0.9.svg
          test -s plan/eia-expansion-v0.9.svg
          test -s plan/eia-semantic-v0.9.3.svg
          test -s plan/eia-semantic-v0.9.4.svg
          test -s plan/eia-road-corridors-v0.9.5.svg
          test -s plan/eia-fountain-landscape-v0.9.6.svg
          test -s plan/eia-integrated-v0.9.7.svg
          test -s plan/eia-fountain-qa-v0.9.8.svg
          test -s data/eia-p07-fountain-proximity-audit-v0.9.8.json
          test -s data/eia-p07-fountain-landscape-v0.9.6.json
          test -s data/eia-p07-road-boundary-candidates-v0.9.5.geojson
          test -s data/eia-p07-semantic-calibrated-v0.9.4.geojson
          test -s data/eia-p07-semantic-candidates-v0.9.3.geojson
          mkdir -p _site/plan
          cp plan/*.svg _site/plan/
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in sorted(Path('_site/plan').glob('*.svg')):
              ET.parse(p)
              print('Validated SVG:',p.name)
          PY
          test -s data/existing-buildings.geojson
          test -s data/roads-osm.geojson
          test -s data/visitor-zone.geojson
          test -s models/c04-massing-v1.0/KKL_Jinning_C04_p07_massing_v1.0.glb.gz
          test -s models/c04-massing-v1.0/preview.jpg
          test -s models/c04-massing-v1.0/metadata.json
          mkdir -p _site/models/c04-massing-v1.0
          cp models/c04-massing-v1.0/KKL_Jinning_C04_p07_massing_v1.0.glb.gz _site/models/c04-massing-v1.0/
          cp models/c04-massing-v1.0/preview.jpg models/c04-massing-v1.0/metadata.json models/c04-massing-v1.0/README.md _site/models/c04-massing-v1.0/
          python3 - <<'PY'
          import gzip, json, struct
          from pathlib import Path
          model=gzip.decompress(Path('_site/models/c04-massing-v1.0/KKL_Jinning_C04_p07_massing_v1.0.glb.gz').read_bytes())
          assert model[:4] == b'glTF' and struct.unpack_from('<I', model, 8)[0] == len(model), 'Invalid GLB container'
          json_length, chunk_type = struct.unpack_from('<II', model, 12)
          assert chunk_type == 0x4E4F534A, 'Missing glTF JSON chunk'
          gltf=json.loads(model[20:20+json_length].decode('utf-8').rstrip(' \x00'))
          assert len(gltf.get('nodes', [])) >= 40, 'GLB has too few model elements'
          json.loads(Path('_site/models/c04-massing-v1.0/metadata.json').read_text(encoding='utf-8'))
          print('Validated compressed C04 GLB:', len(model), 'bytes;', len(gltf.get('nodes', [])), 'nodes')
          PY
          cp -R data _site/data
          python3 -m json.tool _site/data/existing-buildings.geojson > /dev/null
          python3 -m json.tool _site/data/roads-osm.geojson > /dev/null
          python3 -m json.tool _site/data/visitor-zone.geojson > /dev/null
          python3 -m json.tool _site/data/eia-p07-semantic-candidates-v0.9.3.geojson > /dev/null
          python3 -m json.tool _site/data/eia-p07-semantic-calibrated-v0.9.4.geojson > /dev/null
          python3 -m json.tool _site/data/eia-p07-road-boundary-candidates-v0.9.5.geojson > /dev/null
          python3 -m json.tool _site/data/eia-p07-fountain-landscape-v0.9.6.json > /dev/null
          python3 -m json.tool _site/data/eia-p07-fountain-proximity-audit-v0.9.8.json > /dev/null
          touch _site/.nojekyll
          find _site -type f | sort
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
