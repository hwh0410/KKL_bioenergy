name: Deploy 3D site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s index.html
          grep -q '<html' index.html
          mkdir -p _site
          cp index.html _site/index.html
          test -s data/existing-buildings.geojson
          test -s data/roads-osm.geojson
          cp -R data _site/data
          python3 -m json.tool _site/data/existing-buildings.geojson > /dev/null
          python3 -m json.tool _site/data/roads-osm.geojson > /dev/null
          touch _site/.nojekyll
          find _site -type f | sort
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
